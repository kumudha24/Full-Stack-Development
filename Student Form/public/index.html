<!DOCTYPE html>
<html>
<head>
  <title>Student Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Custom Delete Confirmation Modal -->
<div id="deleteModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-icon">&#9888;</div>
    <h3 class="modal-title">Delete Student</h3>
    <p class="modal-message">Are you sure you want to delete this student? This action cannot be undone.</p>
    <div class="modal-actions">
      <button class="modal-cancel-btn" onclick="closeDeleteModal()">Cancel</button>
      <button class="modal-delete-btn" id="deleteConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<div class="form-container">
  <h2>Student Form</h2>

  <!-- Hidden field to track editing state -->
  <input type="hidden" id="editingId" value="">

  <div class="form-group">
    <label>Name</label>
    <input id="name" type="text" placeholder="Enter Name">
    <span class="error" id="nameError"></span>
  </div>

  <div class="form-group">
    <label>Email</label>
    <input id="email" type="email" placeholder="Enter Email">
    <span class="error" id="emailError"></span>
  </div>

  <div class="form-group">
    <label>Date of Birth (DD-MM-YYYY)</label>
    <input id="dob" type="text" placeholder="DD-MM-YYYY" maxlength="10">
    <span class="error" id="dobError"></span>
  </div>

  <div class="form-group">
    <label>Gender</label>
    <div class="radio-group">
      <label class="radio-label">
        <input type="radio" name="gender" value="Male">
        <span class="radio-custom"></span>
        Male
      </label>
      <label class="radio-label">
        <input type="radio" name="gender" value="Female">
        <span class="radio-custom"></span>
        Female
      </label>
      <label class="radio-label">
        <input type="radio" name="gender" value="Transgender">
        <span class="radio-custom"></span>
        Transgender
      </label>
    </div>
    <span class="error" id="genderError"></span>
  </div>

  <div class="form-group">
    <label>Hobbies</label>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" value="Reading"> Reading
      </label>
      <label class="checkbox-label">
        <input type="checkbox" value="Sports"> Sports
      </label>
      <label class="checkbox-label">
        <input type="checkbox" value="Music"> Music
      </label>
      <label class="checkbox-label">
        <input type="checkbox" value="Dancing"> Dancing
      </label>
      <label class="checkbox-label">
        <input type="checkbox" value="Traveling"> Traveling
      </label>
    </div>
    <span class="error" id="hobbiesError"></span>
  </div>

  <div class="form-group">
    <label>Phone Number</label>
    <input id="phone" type="text" placeholder="Enter 10 digit number" maxlength="10">
    <span class="error" id="phoneError"></span>
  </div>

  <div class="form-group">
    <label>Aadhar/PAN Card</label>
    <input id="document" type="file" accept=".pdf,.jpg,.jpeg,.png">
    <span class="doc-note" id="docNote" style="display:none;">Leave blank to keep existing document.</span>
    <span class="error" id="documentError"></span>
  </div>

  <div class="form-group">
    <label>Mode of Education</label>
    <select id="education">
      <option value="">Select Mode</option>
      <option value="State Board">State Board</option>
      <option value="CBSE">CBSE</option>
    </select>
    <span class="error" id="educationError"></span>
  </div>

  <div class="btn-row">
    <button id="cancelBtn" onclick="cancelEdit()" class="cancel-btn" style="display:none;">Cancel</button>
    <button id="saveBtn" onclick="addStudent()" disabled>Save</button>
  </div>
</div>

<h2 style="text-align: center; margin-top: 40px;">Student List</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Email</th>
      <th>DOB</th>
      <th>Gender</th>
      <th>Hobbies</th>
      <th>Phone</th>
      <th>Document</th>
      <th>Education</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="tableData"></tbody>
</table>

<script src="script.js"></script>
</body>
</html>
