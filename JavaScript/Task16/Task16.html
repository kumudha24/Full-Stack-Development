<!DOCTYPE html>
<head>
    <title>Function with parameters</title>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box{
            background-color: #fff;
            padding: 25px 25px;
            border-radius: 8px;
            text-align: center;
        }
        h1{
            margin-bottom: 10px;
            color: #333;
        }
        p{
            color: #555;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Welcome message</h1>
        <p>Check the browser console</p>
    </div>
    <script>
        function welcome(name){
            console.log("Welcome "+name);
        }
        welcome("Rithika");
        welcome("Jenlin");
        welcome("Navadharani");
    </script>
</body>
