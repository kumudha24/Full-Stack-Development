<!DOCTYPE html>
<head>
    <title>Anonymous Function</title>
</head>
<body>
    <div class="box">
        <h1>Check console output</h1>
        <p>Result will be logged in the console</p>
    </div>
    <script>
        let sum=function(a,b){
            return a+b;
        }
        console.log(sum(5,3));
    </script>
</body>
