<html>
    <head>
        <title>Table Design</title>
    </head>
    <body>
        <table border="1">
            <thead>
             <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Mark</th>
             </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Kumudha</td>
                    <td>Physics</td>
                    <td>99</td>
                </tr>
                <tr>
                    <td>Thanujaa</td>
                    <td>Physics</td>
                    <td>95</td>
                </tr>
            </tbody>
        </table><br><br>
        <table border="2">
            <tr>
                <th rowspan="2">Name</th>
                <th colspan="2">Mark</th>
            </tr>
            <tr>
                <th>Maths</th>
                <th>Science</th>
            </tr>
            <tr>
                <td>Kumudha</td>
                <td>96</td>
                <td>97</td>
            </tr>
        </table>
    </body>
</html>
