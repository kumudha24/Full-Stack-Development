<html>
    <head>
        <title>Video Tag Tasks</title>
    </head>
    <body>
        <p>1.Add a video with controls.</p>
        <video controls>
        <source src="video1.mp4" type="video/mp4">
        </video>
        <p>2.Set video width and height.</p>
        <video controls width="500" height="300">
        <source src="video2.mp4" type="video/mp4">
        </video>
        <p>3.Add autoplay and loop.</p>
        <video controls autoplay loop>
        <source src="video3.mp4" type="video/mp4">
        </video>
        <p>4.Add multiple video formats using source.</p>
        <video controls width="500">
        <source src="video4.mp4" type="video/mp4">
        <source src="video4.webm" type="video/webm">
        <source src="video4.ogg" type="video/ogg">
        Your browser does not support the video tag.
        </video>
    </body>
</html>
