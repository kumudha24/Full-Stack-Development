<html>
    <head>
        <title>Audio Tag Tasks</title>
    </head>
    <body>
        <p>1.Add an audio file with controls.</p>
        <audio controls>
        <source src="track1.mp3" type="audio/mpeg">
        </audio>
        <p>2.Make audio autoplay.</p>
        <audio controls autoplay>
        <source src="track2.mp3" type="audio/mpeg">
        </audio>
        <p>3.Add loop to audio.</p>
        <audio controls loop>
        <source src="track3.mp3" type="audio/mpeg">
        </audio>
        <p>4.Add multiple audio formats using source.</p>
        <audio controls>
        <source src="track4.mp3" type="audio/mpeg">
        <source src="track4.ogg" type="audio/ogg">
        <source src="track4.wav" type="audio/wav">
        Your browser does not support the audio element.
        </audio>
    </body>
</html>
