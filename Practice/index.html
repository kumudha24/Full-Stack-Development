<!DOCTYPE html>
<html>
<head>
<style>

table{
    border-collapse: collapse;
    width: 60%;
    margin: 20px auto;
}

th, td{
    border: 2px solid black;
    padding: 10px;
    text-align: center;
}

th{
    background-color: lightblue;
}

</style>
</head>

<body>

<h2 align="center">Student Marks Table</h2>

<table>

<tr>
    <th rowspan="2">Roll No</th>
    <th rowspan="2">Name</th>
    <th colspan="3">Marks</th>
    <th rowspan="2">Total</th>
</tr>

<tr>
    <th>Maths</th>
    <th>Science</th>
    <th>English</th>
</tr>

<tr>
    <td>101</td>
    <td>Rahul</td>
    <td>90</td>
    <td>85</td>
    <td>88</td>
    <td>263</td>
</tr>

<tr>
    <td>102</td>
    <td>Priya</td>
    <td>95</td>
    <td>89</td>
    <td>91</td>
    <td>275</td>
</tr>

<tr>
    <td colspan="5"><b>Class Average</b></td>
    <td>269</td>
</tr>

</table>

</body>
</html>
