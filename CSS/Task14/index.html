<html>
    <head>
        <title>Bootstrap Form</title>
    </head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <body>
        <div class="container mt-5">
        <h2 class="text-center mb-4">Personal Details Form</h2>
        <form>
            <div class="row mb-3">
            <div class="col-mb-6">
            <label for="firstname" class="form-label">First Name:</label>  
            <input type="text" class="form-control" id="firstname" placeholder="enter firstname" required/>
            </div>
            <div class="col-mb-6">
            <label for="lastname" class="form-label">Last Name:</label>  
            <input type="text" class="form-control" id="lastname" placeholder="enter lastname" required/>
            </div>
            <div class="mb-3">
            <label for="email" class="form-label">Email:</label>  
            <input type="email" class="form-control" id="email" placeholder="example@email.com" required/>
            </div>
            <div class="mb-3">
            <label for="phonenumber" class="form-label">Phone Number:</label>  
            <input type="text" class="form-control" id="phonenumber" placeholder="+9-1-xxxxxxxxxx" required/>
            </div>
            <div class="mb-3">
                <label class="form-label d-block">Gender:</label>
                <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="male" value="male" required/>
                <label class="form-check-label" for="male">Male</label> 
                </div>
                <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="female" value="female" required/>
                <label class="form-check-label" for="female">Female</label> 
                </div>
            </div>
            <button class="btn btn-primary">Submit</button>
            </div>
        </form>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
