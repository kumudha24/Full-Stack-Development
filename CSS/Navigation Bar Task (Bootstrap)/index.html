<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <h3 class="mb-4">Navigation Bar</h3>
        <div class="border border-2 d-inline-flex gap-1 p-1 align-items-center">
            <button type="button" class="btn btn-warning px-4 py-2 fw-bold">FORM</button>
            <button type="button" class="btn btn-warning px-4 py-2 fw-bold">SUMMARY</button>
            <button type="button" class="btn btn-warning px-4 py-2 fw-bold">HISTORY</button>
            <button type="button" class="btn btn-warning px-4 py-2 fw-bold">DETAILS</button>
            <button type="button" class="btn btn-warning px-4 py-2 fw-bold">INFO</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
